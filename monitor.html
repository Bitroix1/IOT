<!--
  ==========================================================================
   BUZZER SYSTEM — WEB MONITOR  (dispatch + kitchen queue edition)
  ==========================================================================
   Open in Chrome or Edge. Connect gateway, then power buzzers.

   FLOW:
     1. A buzzer powers on  -> it appears in "Available buzzers" (bottom).
     2. Click "New Order" to enter an order name, then assign it.
        -> the next free buzzer is picked automatically and joins the
           WAITING queue (ordered by entry time).
     3. Every X points a buzzer earns in the trivia game, it climbs one
        spot in the WAITING zone (X is editable in the queue header).
        It can never climb into the locked "In the making" zone.
     4. Hit "In the making" on a waiting order -> it moves into the locked
        top zone (FIFO, nobody jumps in or out of order).
     5. Hit "Order ready" on an in-making order -> the buzzer rings (READY)
        and the order pops OUT of the queue. The buzzer shows back in the
        Available list flagged "Order ready" until the customer presses it.

   SCORES: the master sends "SCORE,<id>,<total>" lines (see the small
   master-code addition shared alongside this file). Scores are cumulative
   trivia points; queue jumps use points earned SINCE the order was assigned.
  ==========================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buzzer Dispatch</title>
<style>
  :root {
    --bg:#14171c; --panel:#1b1f26; --panel-2:#20252e; --line:#2c323c;
    --ink:#e8eaed; --muted:#8b93a0; --idle:#3a414c;
    --amber:#e0a93b; --green:#36c08a; --red:#e2664f; --gold:#f0c65a;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body.modal-open { overflow:hidden; }
  :focus-visible { outline:2px solid var(--green); outline-offset:2px; }

  header { display:flex; align-items:center; gap:18px; padding:18px 26px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); position:sticky; top:0; z-index:10; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand { font-weight:700; letter-spacing:.14em; font-size:15px; text-transform:uppercase; }
  .brand img { width:76px; height:76px; object-fit:contain; border-radius:12px; background:#fff; padding:5px; }
  .brand span { color:var(--green); }
  .status { font-family:var(--mono); font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--idle); }
  .dot.ok { background:var(--green); box-shadow:0 0 8px var(--green); } .dot.err { background:var(--red); }
  .spacer { flex:1; }
  button { font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:10px 16px; cursor:pointer; transition:border-color .15s, background .15s; }
  button:hover:not(:disabled) { border-color:var(--green); }
  button.primary { background:var(--green); color:#06140e; border-color:var(--green); }
  button.warn { border-color:var(--amber); }
  button.warn:hover:not(:disabled) { border-color:var(--amber); background:rgba(224,169,59,.12); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  input { font-family:var(--mono); font-size:13px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .addbox { display:flex; gap:6px; align-items:center; }
  .addbox input { width:56px; }

  main { padding:20px 22px 200px; display:flex; flex-direction:column; gap:20px; }

  /* ---- queue ---- */
  .queue { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .queue-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  .queue-head h2 { margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .queue-head .cfg { font-family:var(--mono); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .queue-head .cfg input { width:64px; }

  /* ---- universal assign bar ---- */
  .assignbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px; margin-bottom:14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; }
  .assignbar input { flex:1; min-width:160px; }
  .assignbar .pick { font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; }
  .assignbar .pick b { color:var(--green); }
  .assignbar .pick.none b { color:var(--red); }

  /* ---- order modal ---- */
  .modal-overlay { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(12,15,20,.36); backdrop-filter:blur(10px) saturate(.85); }
  .modal-overlay[hidden] { display:none; }
  .modal { width:min(520px,100%); background:rgba(27,31,38,.98); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.45); padding:22px; }
  .modal h3 { margin:0 0 8px; font-size:18px; letter-spacing:.04em; }
  .modal p { margin:0 0 18px; color:var(--muted); font-family:var(--mono); font-size:12px; line-height:1.5; }
  .modal input { width:100%; font-size:15px; padding:14px 14px; border-radius:12px; background:var(--bg); }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .modal-actions .ghost { background:transparent; }

  /* ---- zones ---- */
  .zone-label { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .zone-label:first-of-type { margin-top:0; }
  .zone-label .lock { color:var(--red); }
  .zone-label .count { color:var(--ink); }
  .qempty { color:var(--muted); font-size:13px; padding:4px 2px; }
  .queue-grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .queue-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; position:relative; overflow:hidden; }
  .queue-card::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--idle); transition:background .2s, box-shadow .2s; }
  .queue-card.waiting::before { background:var(--gold); }
  .queue-card.making::before { background:var(--red); }
  .queue-card.bump::before { background:var(--green); box-shadow:0 0 16px var(--green); }
  .queue-card .puck-top { display:flex; align-items:baseline; justify-content:space-between; }
  .queue-card .pid { font-family:var(--mono); font-size:26px; font-weight:700; }
  .queue-card .pid small { color:var(--muted); font-size:12px; font-weight:500; }
  .queue-card .state { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .queue-card .state.waiting { color:var(--gold); }
  .queue-card .state.making { color:var(--red); }
  .queue-card .meta { margin:10px 0 14px; font-family:var(--mono); font-size:12px; color:var(--muted); min-height:34px; }
  .queue-card .meta div { margin:2px 0; }
  .queue-card .meta b { color:var(--ink); font-weight:600; }
  .queue-card .meta .tag { color:var(--green); }
  .queue-card .acts { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .queue-card .acts button { padding:7px 0; font-size:12.5px; }

  /* ---- available dock ---- */
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .empty { color:var(--muted); text-align:center; margin-top:24px; font-size:14px; line-height:1.6; }
  .puck { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; position:relative; overflow:hidden; }
  .puck::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--idle); transition:background .2s, box-shadow .2s; }
  .puck.calling::before  { background:var(--green); box-shadow:0 0 16px var(--green); }
  .puck.calling { animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{border-color:var(--line);} 50%{border-color:var(--green);} }
  @media (prefers-reduced-motion:reduce){ .puck.calling{animation:none;} }
  .puck.offline { opacity:.55; }
  .puck-top { display:flex; align-items:baseline; justify-content:space-between; }
  .pid { font-family:var(--mono); font-size:26px; font-weight:700; }
  .pid small { color:var(--muted); font-size:12px; font-weight:500; }
  .state { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .state.idle{color:var(--muted);} .state.calling{color:var(--green);}
  .meta { margin:10px 0 14px; font-family:var(--mono); font-size:12px; color:var(--muted); min-height:34px; }
  .meta div { margin:2px 0; } .meta b { color:var(--ink); font-weight:600; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .acts button { padding:7px 0; font-size:12.5px; }

  .logwrap { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); }
  .logbar { display:flex; align-items:center; gap:12px; padding:8px 18px; font-family:var(--mono); font-size:12px; color:var(--muted); cursor:pointer; }
  .log { height:0; overflow:auto; transition:height .18s; font-family:var(--mono); font-size:11.5px; line-height:1.7; padding:0 18px; color:var(--muted); }
  .log.open { height:150px; padding:6px 18px 12px; }
  .log .tx { color:var(--green); } .log .rx { color:var(--ink); }
</style>
</head>
<body>

<header>
  <div class="brand"><img src="image.png" alt="Haverim Lab" />Buzzer&nbsp;<span>Dispatch</span></div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Not connected</span></div>
  <div class="spacer"></div>
  <div class="addbox"><input id="addId" type="number" min="1" max="31" placeholder="#" /><button id="addBtn">Add buzzer</button></div>
  <button id="connectBtn" class="primary">Connect gateway</button>
</header>

<main>
  <!-- QUEUE (main part of the page) -->
  <div class="queue">
    <div class="queue-head">
      <span class="spacer"></span>
      <span class="cfg">climb one spot every <input id="ppsInput" type="number" min="50" step="50" value="1000" /> pts</span>
    </div>

    <!-- universal assign -->
    <div class="assignbar">
      <button id="assignBtn" class="primary">New Order</button>
      <span id="pickHint" class="pick"></span>
    </div>

    <!-- zones injected here -->
    <div id="queue"></div>
  </div>

  <!-- AVAILABLE BUZZERS (bottom of the page) -->
  <div>
    <div class="zone-label" style="margin-top:0">Available buzzers</div>
    <div id="empty" class="empty">No buzzers yet. Connect the gateway, then power a buzzer — it appears here on its own.</div>
    <div id="grid" class="grid"></div>
  </div>
</main>

<div class="logwrap">
  <div class="logbar" id="logToggle">▸ Serial log <span id="logCount"></span></div>
  <div id="log" class="log"></div>
</div>

<div id="orderModal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
    <h3 id="orderModalTitle">New Order</h3>
    <p>Type the order content, then assign it to the next free buzzer.</p>
    <input id="orderModalInput" type="text" placeholder="Order" />
    <div class="modal-actions">
      <button id="orderModalCancel" class="ghost">Cancel</button>
      <button id="orderModalSave" class="primary">Assign order</button>
    </div>
  </div>
</div>

<script>
// ---------- state ----------
// board: id -> {id,state,node,order,assignedAt,calledAt,score,scoreBase,promo,lastSeen}
//   state: "idle" | "waiting" | "making" | "calling"
const board = {};
let makingOrder  = [];   // ids in the locked top zone (FIFO, no reordering)
let waitingOrder = [];   // ids in the waiting zone (entry time + point jumps)
let pointsPerSpot = 1000;// every X points earned since assign -> up one spot in the waiting zone
let bumpIds = new Set();
let port, reader, writer, keepReading = false, rxBuf = "";
const $ = (id) => document.getElementById(id);

// ---------- connection ----------
async function toggleConnect() {
  if (port) { await disconnect(); return; }
  if (!("serial" in navigator)) { setStatus("Use Chrome or Edge (no Web Serial here).","err"); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate:115200 });
    writer = port.writable.getWriter();
    keepReading = true;
    setStatus("Connected","ok"); $("connectBtn").textContent = "Disconnect";
    readLoop();
  } catch (e) { port = null; setStatus("Connection cancelled","err"); }
}
async function disconnect() {
  keepReading = false;
  try { await reader?.cancel(); } catch(e){}
  try { writer?.releaseLock(); } catch(e){}
  try { await port?.close(); } catch(e){}
  port = writer = reader = null;
  setStatus("Disconnected",""); $("connectBtn").textContent = "Connect gateway";
}
async function readLoop() {
  const dec = new TextDecoder();
  reader = port.readable.getReader();
  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      rxBuf += dec.decode(value,{stream:true});
      let nl;
      while ((nl = rxBuf.indexOf("\n")) >= 0) {
        const ln = rxBuf.slice(0,nl).trim();
        rxBuf = rxBuf.slice(nl+1);
        if (ln) handleLine(ln);
      }
    }
  } catch (e) { log("read error: "+e.message); }
  finally { try { reader.releaseLock(); } catch(e){} }
}
async function send(text) {
  if (!writer) { setStatus("Not connected","err"); return; }
  log(text,"tx");
  await writer.write(new TextEncoder().encode(text+"\n"));
}

// ---------- protocol in ----------
function handleLine(ln) {
  const p = ln.split(",");
  const tag = p[0], id = parseInt(p[1],10);

  if (tag === "ONLINE") {
    const isNew = !board[id];
    ensure(id); board[id].node = p[2]; board[id].lastSeen = Date.now();
    if (isNew) log(ln,"rx");
  } else if (tag === "ACK") {
    ensure(id); board[id].lastSeen = Date.now(); log(ln,"rx");
  } else if (tag === "BUTTON") {
    ensure(id); board[id].lastSeen = Date.now();
    if (board[id].state === "calling") {
      log("buzz stopped on buzzer #" + id, "rx");
    } else {
      log(ln, "rx");
    }
  } else if (tag === "SCORE") {
    ensure(id); board[id].lastSeen = Date.now();
    board[id].score = parseInt(p[2],10) || 0;   // cumulative trivia total from the master
    applyAutoPromotion(id);
    log(ln,"rx");
  } else {
    log(ln,"rx");   // DELIVERY / LOG / master scoreboard prints
  }
  render();
}

// ---------- protocol out / actions ----------
// Universal assign: auto-pick the next free buzzer for the typed order.
function nextFreeBuzzer() {
  const ids = Object.keys(board).map(Number).filter(id => board[id].state === "idle").sort((a,b)=>a-b);
  const online = ids.filter(id => board[id].lastSeen && (Date.now()-board[id].lastSeen <= 30000));
  return (online[0] ?? ids[0] ?? null);
}
function assignOrder(label) {
  const id = nextFreeBuzzer();
  if (id == null) { setStatus("No free buzzer to assign","err"); return; }
  ensure(id);
  board[id].state = "waiting";
  board[id].order = (label || "").trim();
  board[id].assignedAt = Date.now();
  board[id].calledAt = 0;
  board[id].scoreBase = board[id].score;   // points from here on count toward queue jumps
  board[id].promo = 0;
  if (!waitingOrder.includes(id)) waitingOrder.push(id);
  send("ASSIGN,"+id);
  render();
}
function openOrderModal() {
  if ($("assignBtn").disabled) return;
  $("orderModalInput").value = "";
  $("orderModal").hidden = false;
  document.body.classList.add("modal-open");
  window.setTimeout(() => $("orderModalInput").focus(), 0);
}
function closeOrderModal() {
  $("orderModal").hidden = true;
  document.body.classList.remove("modal-open");
}
function saveOrderFromModal() {
  const label = $("orderModalInput").value.trim();
  assignOrder(label);
  closeOrderModal();
}
// Move a waiting order into the locked "In the making" zone (monitor-only, no radio).
function toMaking(id) {
  if (!board[id] || board[id].state !== "waiting") return;
  waitingOrder = waitingOrder.filter(x => x !== id);
  board[id].state = "making";
  if (!makingOrder.includes(id)) makingOrder.push(id);   // FIFO: joins the back of the making zone
  render();
}
// Order ready: ring the buzzer (READY) and pop the order out of the queue.
function orderReady(id) {
  if (!board[id] || board[id].state !== "making") return;
  removeFromQueue(id);
  board[id].state = "calling";
  board[id].calledAt = Date.now();
  send("READY,"+id);
  render();
}
function questionBuzzer(id) { send("QUESTION,"+id); }
function clearBuzzer(id)    { send("CLEAR,"+id); returnBuzzer(id); }   // website collects and returns to idle

function returnBuzzer(id) {
  ensure(id);
  board[id].state = "idle";
  board[id].order = ""; board[id].assignedAt = 0; board[id].calledAt = 0;
  board[id].scoreBase = board[id].score; board[id].promo = 0;
  removeFromQueue(id);
  render();
}

// ---------- queue mechanics ----------
function removeFromQueue(id) {
  makingOrder  = makingOrder.filter(x => x !== id);
  waitingOrder = waitingOrder.filter(x => x !== id);
}
function earnedSince(id) { const b = board[id]; return Math.max(0, (b.score||0) - (b.scoreBase||0)); }

// Every X points earned SINCE assignment climbs one spot — but only inside the
// waiting zone. A waiting order can reach the top of the waiting zone yet never
// cross into the locked "In the making" zone above it.
function applyAutoPromotion(id) {
  if (!waitingOrder.includes(id)) return;
  const want = Math.floor(earnedSince(id) / pointsPerSpot);
  while (board[id].promo < want) {
    const i = waitingOrder.indexOf(id);
    if (i <= 0) { board[id].promo = want; break; }   // already top of the waiting zone
    [waitingOrder[i-1], waitingOrder[i]] = [waitingOrder[i], waitingOrder[i-1]];
    board[id].promo++;
    flashBump(id);
  }
}
function flashBump(id) {
  bumpIds.add(id);
  render();
  setTimeout(() => { bumpIds.delete(id); render(); }, 2500);
}

// ---------- rendering ----------
function orderLabel(b) { return b.order ? b.order : "(no label)"; }

function renderQueue() {
  const making  = makingOrder.filter(id => board[id] && board[id].state === "making");
  const waiting = waitingOrder.filter(id => board[id] && board[id].state === "waiting");
  const el = $("queue");
  let html = "";

  // --- locked "In the making" zone ---
  html += `<div class="zone-label"><span class="lock">In the making</span>
             <span class="count">${making.length ? "· "+making.length : ""}</span></div>`;
  if (!making.length) {
    html += `<div class="qempty">Nothing being prepared</div>`;
  } else {
    html += `<div class="queue-grid">${making.map(id => queueCard(id, "making")).join("")}</div>`;
  }

  // --- waiting zone (entry time + point jumps) ---
  html += `<div class="zone-label"><span>Waiting</span>
             <span class="count">${waiting.length ? "· "+waiting.length : ""}</span></div>`;
  if (!waiting.length) {
    html += `<div class="qempty">No orders waiting. Type an order above and hit "Assign order".</div>`;
  } else {
    html += `<div class="queue-grid">${waiting.map(id => queueCard(id, "waiting")).join("")}</div>`;
  }

  el.innerHTML = html;
  el.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.id,10);
      ({ ready:orderReady, making:toMaking, cancel:clearBuzzer })[btn.dataset.act](id);
    };
  });
}

function queueCard(id, zone) {
  const b = board[id];
  const earned = earnedSince(id);
  const nextAt = (b.promo + 1) * pointsPerSpot;
  const top = zone === "waiting" && waitingOrder.indexOf(id) === 0;
  const stateLabel = zone === "making" ? "In the making" : "Waiting";
  const stateClass = zone === "making" ? "making" : "waiting";
  const info = zone === "making"
    ? `score <b>${b.score||0}</b> pts · <span class="tag"></span>`
    : `score <b>${b.score||0}</b> pts · earned <b>${earned}</b>
       · ${top ? '<span class="tag"></span>' : `next jump at <b>${nextAt}</b>`}`;
  const primaryAct = zone === "making"
    ? `<button class="primary" data-act="ready" data-id="${id}">Order ready</button>`
    : `<button class="warn" data-act="making" data-id="${id}">In the making</button>`;
  return `<div class="queue-card ${stateClass} ${bumpIds.has(id) ? "bump" : ""}">
    <div class="puck-top">
      <div class="pid">#${id} <small>${b.node ? "node "+String(b.node).slice(-4) : ""}</small></div>
      <div class="state ${stateClass}">${stateLabel}</div>
    </div>
    <div class="meta">
      <div>order <b>${orderLabel(b)}</b></div>
      <div>${info}</div>
    </div>
    <div class="acts">
      ${primaryAct}
      <button data-act="cancel" data-id="${id}">Cancel</button>
    </div>
  </div>`;
}

const AVAIL_LABEL = { idle:"Available", calling:"Order ready" };

function renderAvailable() {
  const ids = Object.keys(board).map(Number)
    .filter(id => board[id].state === "idle" || board[id].state === "calling")
    .sort((a,b)=>a-b);
  $("empty").style.display = Object.keys(board).length ? "none" : "block";

  const grid = $("grid"); grid.innerHTML = "";
  ids.forEach(id => {
    const b = board[id];
    const offline = b.lastSeen && (Date.now()-b.lastSeen > 30000);
    const card = document.createElement("div");
    card.className = "puck " + b.state + (offline ? " offline" : "");

    let meta = "";
    meta += `<div>score <b>${b.score||0}</b> pts</div>`;
    if (b.state === "calling") meta += `<div style="color:var(--green)">order ready · awaiting pickup <b>${fmtAgo(b.calledAt)}</b></div>`;
    if (offline)               meta += `<div style="color:var(--red)">offline</div>`;

    const acts = (b.state === "calling")
      ? `<button class="primary" data-act="clear"    data-id="${id}" style="grid-column:1 / -1">Collected</button>`
      : `<button              data-act="question" data-id="${id}" style="grid-column:1 / -1">Test</button>`;

    card.innerHTML = `
      <div class="puck-top">
        <div class="pid">#${id} <small>${b.node ? "node "+String(b.node).slice(-4) : ""}</small></div>
        <div class="state ${b.state}">${AVAIL_LABEL[b.state]}</div>
      </div>
      <div class="meta">${meta}</div>
      <div class="acts">${acts}</div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.id,10);
      ({ question:questionBuzzer, clear:clearBuzzer })[btn.dataset.act](id);
    };
  });
}

function renderPickHint() {
  const id = nextFreeBuzzer();
  const el = $("pickHint");
  if (id == null) { el.className = "pick none"; el.innerHTML = "next free buzzer: <b>none</b>"; $("assignBtn").disabled = true; }
  else            { el.className = "pick";      el.innerHTML = `next free buzzer: <b>#${id}</b>`; $("assignBtn").disabled = false; }
}

function render() {
  renderQueue();
  renderAvailable();
  renderPickHint();
}

function fmtAgo(ts){ if(!ts)return"—"; let s=Math.floor((Date.now()-ts)/1000); const m=Math.floor(s/60); s%=60; return (m?m+"m ":"")+s+"s"; }

// ---------- ui chrome ----------
function setStatus(t,k){ $("statusText").textContent=t; $("dot").className="dot "+(k||""); }
let logLines=0;
function log(text,kind){
  const el=document.createElement("div"); el.className=kind||"";
  const arrow = kind==="tx"?"→ ":kind==="rx"?"← ":"  ";
  el.textContent=new Date().toLocaleTimeString()+"  "+arrow+text;
  $("log").appendChild(el); $("log").scrollTop=$("log").scrollHeight;
  $("logCount").textContent="("+(++logLines)+")";
}
function ensure(id){ if(!board[id]) board[id]={ id, state:"idle", node:"", order:"", assignedAt:0, calledAt:0, score:0, scoreBase:0, promo:0, lastSeen:0 }; }

$("connectBtn").onclick = toggleConnect;
$("addBtn").onclick   = () => { const v=parseInt($("addId").value,10); if(v>=1&&v<=31){ ensure(v); render(); $("addId").value=""; } };
$("assignBtn").onclick = openOrderModal;
$("orderModalCancel").onclick = closeOrderModal;
$("orderModalSave").onclick = saveOrderFromModal;
$("orderModalInput").addEventListener("keydown", e => {
  if (e.key === "Enter") saveOrderFromModal();
  if (e.key === "Escape") closeOrderModal();
});
$("orderModal").addEventListener("click", e => { if (e.target === $("orderModal")) closeOrderModal(); });
$("logToggle").onclick = () => { const open=$("log").classList.toggle("open"); $("logToggle").firstChild.textContent=(open?"▾":"▸")+" Serial log "; };
$("ppsInput").onchange = () => {
  pointsPerSpot = Math.max(50, parseInt($("ppsInput").value,10) || 1000);
  Object.keys(board).map(Number).forEach(applyAutoPromotion);   // re-evaluate jumps against the new X
  render();
};

setInterval(render, 1000);
render();
</script>
</body>
</html>
